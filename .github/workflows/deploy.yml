name: Backend CI/CD

on:
  push:
    branches:
      - infra/deploy

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/gdgoc-team-01/backend

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Test and build
        run: ./gradlew clean test bootJar

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Push Docker image
        run: docker push "$IMAGE_NAME:${{ github.sha }}"

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, deploy]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Deploy services
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          mkdir -p ~/backend

          cp docker-compose.prod.yml ~/backend/
          cp Caddyfile ~/backend/

          cd ~/backend

          docker compose -p backend -f docker-compose.prod.yml config --quiet
          docker compose -p backend -f docker-compose.prod.yml pull backend
          docker compose -p backend -f docker-compose.prod.yml up -d --remove-orphans

      - name: Check deployment
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          cd ~/backend
          docker compose -p backend -f docker-compose.prod.yml ps

          for i in $(seq 1 30); do
            if STATUS=$(curl -sS --max-time 3 \
              -o /dev/null -w "%{http_code}" \
              http://localhost:8080/actuator/health) \
              && [ "$STATUS" = "200" ]; then
              echo "Deployment successful"
              exit 0
            fi

            echo "Waiting for application to become healthy ($i/30)"
            sleep 5
          done

          echo "Deployment health check failed"
          docker logs --tail 100 hobanwoo-backend
          exit 1

      - name: Check HTTPS
        run: |
          for i in $(seq 1 30); do
            if STATUS=$(curl -sS --max-time 5 \
              -o /dev/null -w "%{http_code}" \
              https://hobanwooradar.duckdns.org/actuator/health) \
              && [ "$STATUS" = "200" ]; then
              echo "HTTPS health check successful"
              exit 0
            fi

            echo "Waiting for HTTPS ($i/30)"
            sleep 5
          done

          echo "HTTPS health check failed"
          docker logs --tail 100 hobanwoo-caddy
          exit 1

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io