<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
</head>
<body>
<main>
    <h1>로그인</h1>
    <p>경북대학교 Google 계정(@knu.ac.kr)으로 로그인해 주세요.</p>
    <p id="login-error" role="alert" hidden>로그인에 실패했어요. 학교 계정을 확인하고 다시 시도해 주세요.</p>
    <a href="/oauth2/authorization/google">구글로 로그인</a>
</main>
<script>
    if (window.location.pathname === "/login/failed") {
        document.querySelector("#login-error").hidden = false;
    }
</script>
</body>
</html>
